<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#262522">
    <title>TOP — igraj šah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=20260910-6">
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="sidebar">
        <button class="brand" data-view="home" aria-label="TOP početna">
          <span>TOP</span>
        </button>
        <nav aria-label="Glavna navigacija">
          <button data-view="home"><span>Igraj sa botom</span></button>
          <button data-action="new-game"><span>Nova partija</span></button>
          <button data-action="join-game"><span>Unesi kod</span></button>
          <button data-view="friends"><span>Prijatelji</span></button>
        </nav>
        <div class="sidebar-account">
          <button data-view="profile" id="sidebarUser" class="sidebar-user" aria-label="Otvori profil" title="Profil">
            <span id="sidebarAvatar" class="sidebar-avatar">G</span>
            <span><b id="sidebarUsername">Gost</b><small id="sidebarCountry">Bez naloga</small></span>
          </button>
          <button data-view="login" id="authBtn" class="auth-button"><span>Prijava</span></button>
        </div>
      </header>
      <main id="root"></main>
    </div>
    <script src="/app.js?v=20260910-6"></script>
  </body>
</html>
