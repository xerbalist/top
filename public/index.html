<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#262522">
    <title>TOP — igraj šah</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="sidebar">
        <button class="brand" data-view="home" aria-label="TOP početna">
          <img class="brand-mark" src="/top-logo.svg" alt="">
          <span>TOP</span>
        </button>
        <nav aria-label="Glavna navigacija">
          <button data-view="home"><span class="nav-icon">♞</span><span>Igraj sa botom</span></button>
          <button data-action="new-game"><span class="nav-icon">♜</span><span>Nova partija</span></button>
          <button data-action="join-game"><span class="nav-icon">➜</span><span>Unesi kod</span></button>
          <button data-view="friends"><span class="nav-icon">♙</span><span>Prijatelji</span></button>
        </nav>
        <div class="sidebar-account">
          <button data-view="profile" id="sidebarUser" class="sidebar-user" aria-label="Otvori profil" title="Profil">
            <span id="sidebarAvatar" class="sidebar-avatar">G</span>
            <span><b id="sidebarUsername">Gost</b><small id="sidebarCountry">Bez naloga</small></span>
          </button>
          <button data-view="login" id="authBtn" class="auth-button"><span class="nav-icon">●</span><span>Prijava</span></button>
        </div>
      </header>
      <main id="root"></main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
