services:
  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      NODE_ENV: ${NODE_ENV:-production}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL mora biti podešen na HTTPS adresu aplikacije}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: top
      PGUSER: top
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mora biti podešen}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET mora biti podešen}
      MNEMONIC_PEPPER: ${MNEMONIC_PEPPER:?MNEMONIC_PEPPER mora biti podešen}
      ANONYMOUS_SECRET_MOVES: '${ANONYMOUS_SECRET_MOVES:?ANONYMOUS_SECRET_MOVES mora biti podešen}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: top
      POSTGRES_USER: top
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mora biti podešen}
    volumes:
      - top-db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U top -d top"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  top-db:
